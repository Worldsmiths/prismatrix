name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin: Thin3D P1 + UiKit engine-ui-slice (E1+E2)
  WORLDSMITHS_ENGINE_REF: 8ba5735cebebb53d0cca98d19314323189650d5f
  WORLDSMITHS_ENGINE_ROOT: ${{ github.workspace }}/engine

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Prismatrix
        uses: actions/checkout@v7
        with:
          path: game

      - name: Checkout Worldsmiths engine (pinned SHA)
        uses: actions/checkout@v7
        with:
          repository: Worldsmiths/worldsmiths
          ref: ${{ env.WORLDSMITHS_ENGINE_REF }}
          path: engine

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Bar C gate (no direct gdx / no com.badlogic.gdx imports)
        working-directory: game
        run: bash ci/assert-bar-c.sh

      - name: Compile desktop and run game tests
        working-directory: game
        run: |
          chmod +x gradlew
          ./gradlew :desktop:compileJava :game:test --no-daemon
